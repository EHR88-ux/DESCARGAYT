name: Construir APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar QuickJS para Android (arm64)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/quickjs-ng/quickjs /tmp/quickjs
          cmake -S /tmp/quickjs -B /tmp/qjs-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/qjs-build -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          BIN="$(find /tmp/qjs-build -type f -name qjs | head -n1)"
          echo "Binario: $BIN"
          cp "$BIN" app/src/main/jniLibs/arm64-v8a/libqjs.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DescargaYT.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DescargaYT-apk
          path: DescargaYT.apk

      - name: Publicar en Releases (enlace para compartir)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DescargaYT.apk
